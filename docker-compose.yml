# Stack PRAWDOWID. Uruchamiaj z katalogu głównego monorepo: docker compose up -d --build  (albo make start)
name: wrobel

services:
  # Jeden Postgres 16 + pgvector + tsvector: gateway (checks, audit_events), PageScrapper (documents,
  # scrape_runs), VerificationPipeline (source, document, chunk, corpus_version, check, case).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: prawdowid
      POSTGRES_DB: prawdowid
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Seed (korpus + embeddingi bge-m3) ładowany tylko przy pierwszym starcie z pustym wolumenem.
      # Regeneracja z działającej bazy: make seed-dump
      - ./db/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prawdowid -d prawdowid"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ocr:
    ports:
      - "127.0.0.1:8001:8000"
    build:
      context: ./ImageRecognitionServcie
      dockerfile: Dockerfile
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: 8000
      OCR_LANGS: pl,en
      OCR_CALLBACK_URL: ""
      OCR_OFFLINE: "true"
      OCR_PADDLE_ENABLE_MKLDNN: "false"
      OCR_MODEL_DIR: /opt/models
      OCR_LOG_JSON: "true"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      ADMIN_API_KEY: change-me-admin
      CORS_ORIGINS: http://localhost:4200
      TRUSTED_PROXIES: 127.0.0.1
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: prawdowid
      POSTGRES_DB: prawdowid
      DATABASE_URL: postgresql+asyncpg://prawdowid:prawdowid@postgres:5432/prawdowid
      IMAGE_RECOGNITION_URL: http://ocr:8000
      LLM_SERVICE_URL: http://verification-pipeline:8000
      PAGE_SCRAPPER_URL: http://page-scrapper:8002
      # "pipeline" = model z konfiguracji VerificationPipeline; zmiana bez przebudowy:
      # PATCH /api/v1/config {"llm_provider": "anthropic", "llm_model": "claude-opus-5-5"}
      LLM_PROVIDER: pipeline
      LLM_MODEL: conf
      # Pełne sprawdzenie z Bielikiem (zdalnie) i rerankerem (CPU) trwa ~30-60 s; zapas na kolejkę.
      # Musi być mniejszy niż proxy_read_timeout w proxy/nginx.conf.
      DOWNSTREAM_TIMEOUT_SECONDS: "180"
      MOCK_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_started
      page-scrapper:
        condition: service_healthy
      verification-pipeline:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    environment:
      PORT: 4000
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "4200:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    restart: unless-stopped

  # URL fetcher (live, dane niezaufane) + ingestion worker (cron / recznie) -> wspolny Postgres
  # Brak auth: port wystawiony tylko na localhost do testow, ruch produkcyjny idzie przez api-gateway.
  page-scrapper:
    build:
      context: ./PageScrapper
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      LOG_LEVEL: INFO
      DOCS_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://prawdowid:prawdowid@postgres:5432/prawdowid
      SOURCES_FILE: sources.yaml
      REQUEST_TIMEOUT_SECONDS: "15"
      RENDER_ENABLED: "true"
      SCRAPE_INTERVAL_MINUTES: "360"
      SCRAPE_ON_STARTUP: "false"
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      EUVSDISINFO_TOKEN: ${EUVSDISINFO_TOKEN:-}
      RAG_INGEST_URL: http://verification-pipeline:8000/ingest
    volumes:
      - ./PageScrapper/imports:/app/imports:ro
    shm_size: "512mb"
    depends_on:
      postgres:
        condition: service_healthy
      verification-pipeline:
        condition: service_healthy
    restart: unless-stopped

  # Verification pipeline (Kedro): ekstrakcja twierdzen -> zapytania -> hybrid retrieval (BM25/tsvector
  # + wektor, RRF) -> stance -> polityka werdyktu (reguly, nie LLM) -> odpowiedz -> walidator cytatow.
  # Bez auth: port tylko na localhost, ruch produkcyjny idzie przez api-gateway.
  verification-pipeline:
    build:
      context: ./VerificationPipeline
      dockerfile: Dockerfile
      args:
        WITH_RERANK: ${WITH_RERANK:-false}
    # Linux: host.docker.internal -> host (SSH tunnel to the Bielik/bge-m3 server listens there)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/home/pipeline/.cache/huggingface   # reranker weights survive restarts
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      LOG_LEVEL: INFO
      PRAWDOWID_ENV: docker
      DATABASE_URL: postgresql://prawdowid:prawdowid@postgres:5432/prawdowid
      PRAWDOWID_SYNC_ON_STARTUP: "true"
      # Model LLM (wszystkie role). Puste = conf/ (provider mock: reguly, bez sieci).
      # Np. PRAWDOWID_LLM_PROVIDER=litellm, PRAWDOWID_LLM_MODEL=anthropic/claude-opus-5-5
      PRAWDOWID_LLM_PROVIDER: ${PRAWDOWID_LLM_PROVIDER:-}
      PRAWDOWID_LLM_MODEL: ${PRAWDOWID_LLM_MODEL:-}
      PRAWDOWID_LLM_API_BASE: ${PRAWDOWID_LLM_API_BASE:-}
      # Male modele lokalne (Bielik w Ollamie: okno 4096 tokenow): przyklad JSON zamiast schematu
      # i mniejszy kontekst. Puste = conf/.
      PRAWDOWID_LLM_JSON_MODE: ${PRAWDOWID_LLM_JSON_MODE:-}
      # 0 dla Bielika/Ollamy (domyslnie 0.8: ten sam wpis daje rozne twierdzenia). Puste dla Claude.
      PRAWDOWID_LLM_TEMPERATURE: ${PRAWDOWID_LLM_TEMPERATURE:-}
      PRAWDOWID_RETRIEVAL_TOP_K: ${PRAWDOWID_RETRIEVAL_TOP_K:-}
      PRAWDOWID_MAX_CONTEXT_CHARS: ${PRAWDOWID_MAX_CONTEXT_CHARS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Embeddingi (korpus i zapytania tym samym modelem). Puste = conf/ (mock). Zmiana modelu
      # = automatyczne przeliczenie korpusu przy starcie (nowy corpus_version).
      PRAWDOWID_EMBEDDINGS_PROVIDER: ${PRAWDOWID_EMBEDDINGS_PROVIDER:-}
      PRAWDOWID_EMBEDDINGS_MODEL: ${PRAWDOWID_EMBEDDINGS_MODEL:-}
      PRAWDOWID_EMBEDDINGS_API_BASE: ${PRAWDOWID_EMBEDDINGS_API_BASE:-}
      # Reranker: provider local (CPU, obraz z WITH_RERANK=true) albo remote (GPU na serwerze,
      # VerificationPipeline/deploy/rerank-server, przez tunel SSH). fallback=local: CPU, gdy serwer
      # nie odpowiada (też wymaga WITH_RERANK=true).
      PRAWDOWID_RERANKER_ENABLED: ${PRAWDOWID_RERANKER_ENABLED:-}
      PRAWDOWID_RERANKER_PROVIDER: ${PRAWDOWID_RERANKER_PROVIDER:-}
      PRAWDOWID_RERANKER_API_BASE: ${PRAWDOWID_RERANKER_API_BASE:-}
      PRAWDOWID_RERANKER_FALLBACK: ${PRAWDOWID_RERANKER_FALLBACK:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Kanal 2: bot Discord (/wrobel, menu "Sprawdz w Wroblu", DM, @wzmianka). Cienki adapter na API
  # Gateway (X-Channel: discord), bez wlasnej logiki weryfikacji. Startuje tylko z profilem "discord"
  # (start.sh wlacza go sam, gdy w .env jest DISCORD_TOKEN): docker compose --profile discord up -d
  discord-bot:
    profiles: ["discord"]
    build:
      context: ./DiscordBot
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      GATEWAY_URL: http://api-gateway:8000
      USER_LIMIT_PER_MINUTE: ${DISCORD_USER_LIMIT_PER_MINUTE:-5}
      REQUEST_TIMEOUT_SECONDS: "120"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ContextGraph (profil "graph", poza domyslnym startem): graf Neo4j zgodny z kontraktem pipeline'u
  # (VerificationPipeline/docs/neo4j-kontrakt.md) + zdarzenia z Bielika. make graph-up, make graph-sync.
  # Seed grafu (db/neo4j-seed/neo4j.dump) wczytywany jednorazowo, tylko gdy wolumen neo4j-data jest pusty.
  # Regeneracja z działającego grafu: make graph-seed-dump
  neo4j-seed:
    image: neo4j:5.26-community
    profiles: ["graph"]
    user: "7474:7474"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ -d /data/databases/neo4j ]; then echo "neo4j-data nie jest pusty: pomijam seed"; exit 0; fi
        if [ ! -f /seed/neo4j.dump ]; then echo "brak db/neo4j-seed/neo4j.dump: pusty graf"; exit 0; fi
        neo4j-admin database load neo4j --from-path=/seed
    volumes:
      - neo4j-data:/data
      - ./db/neo4j-seed:/seed:ro

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    depends_on:
      neo4j-seed:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-contextgraph}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  context-graph:
    build:
      context: ./ContextGraph
      dockerfile: Dockerfile
    profiles: ["graph"]
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-contextgraph}
      # Ollama na serwerze z GPU przez tunel SSH na hoscie (ContextGraph/README.md)
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
      EMBEDDINGS_API_BASE: ${EMBEDDINGS_API_BASE:-http://host.docker.internal:21434}
      EVENTS_PROVIDER: ${EVENTS_PROVIDER:-none}
      EVENTS_MODEL: ${EVENTS_MODEL:-SpeakLeash/bielik-11b-v2.3-instruct:Q4_K_M}
      EVENTS_API_BASE: ${EVENTS_API_BASE:-http://host.docker.internal:21434/v1}
      EVENTS_API_KEY: ${EVENTS_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  hf-cache:
  neo4j-data:
