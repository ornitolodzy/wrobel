services:
  scraper-postgres:
    image: postgres:16
    container_name: prawdowid-scraper-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - scraper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  page-scrapper:
    build: .
    container_name: prawdowid-page-scrapper
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@scraper-postgres:5432/${POSTGRES_DB}
    volumes:
      - ./imports:/app/imports:ro
    shm_size: "512mb"
    depends_on:
      scraper-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scraper-postgres-data:
