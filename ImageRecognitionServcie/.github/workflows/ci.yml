name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    env:
      OCR_MODEL_DIR: ${{ github.workspace }}/.cache/ocr-models
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check src tests examples scripts

      - name: Ruff (format)
        run: uv run ruff format --check src tests examples scripts

      - name: Mypy
        run: uv run mypy

      - name: Fonts for OCR test images
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ${{ env.OCR_MODEL_DIR }}
          key: ocr-models-${{ hashFiles('src/ocr_service/config.py', 'uv.lock') }}

      - name: Tests
        run: uv run pytest -v

  docker:
    name: Docker image (CPU)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: screenscrapper-ocr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (no network access in the container)
        run: |
          docker run -d --name ocr --network none screenscrapper-ocr:ci
          for i in $(seq 1 60); do
            if docker exec ocr python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"; then
              echo "ready after ${i} attempts"; break
            fi
            sleep 3
          done
          docker exec ocr python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
          test "$(docker exec ocr id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs ocr || true
