services:
  ocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: screenscrapper-ocr:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OCR_LOG_JSON: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "4"     # OCR_WORKERS=0 (auto) -> 4 workers
          memory: 4g    # ~700 MB per worker + API process
    restart: unless-stopped

  # GPU variant (draft) - start with: docker compose --profile gpu up ocr-gpu
  ocr-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    image: screenscrapper-ocr:gpu
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
