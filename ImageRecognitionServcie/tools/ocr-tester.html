<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Tester</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6eb; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:16px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select, button { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); background:#eff4ff; }
  #status { font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  #preview { position:relative; display:inline-block; max-width:100%; }
  #preview img { display:block; max-width:100%; border-radius:6px; }
  #preview svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; background:#f3f4f6; border-radius:6px; padding:12px; max-height:420px; overflow:auto; font:13px/1.45 Consolas, monospace; }
  .meta { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .meta b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>OCR Tester</h1>
  <div class="muted">Wybierz, przeciągnij albo wklej (Ctrl+V) zrzut ekranu i wyślij go do serwisu OCR.</div>

  <div class="card">
    <div class="row">
      <label>Adres serwisu <input id="url" value="http://localhost:8000" size="26"></label>
      <label>X-API-Key (opcjonalnie) <input id="key" placeholder="puste = brak" size="16"></label>
      <label>Języki <input id="langs" value="pl,en" size="8"></label>
      <label>Wynik
        <select id="output"><option value="blocks">blocks</option><option value="text">text</option></select>
      </label>
      <span id="status" class="muted">sprawdzam serwis…</span>
    </div>
  </div>

  <div class="card">
    <div id="drop">Kliknij, aby wybrać plik (PNG / JPEG / WebP)<br><span class="muted">albo przeciągnij go tutaj, albo wklej Ctrl+V</span></div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <div class="row" style="margin-top:12px">
      <button id="send" disabled>Wyślij do OCR</button>
      <span id="fileinfo" class="muted"></span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="muted" style="margin-bottom:8px">Podgląd (ramki = rozpoznane bloki)</div>
      <div id="preview"><img id="img" alt=""><svg id="boxes"></svg></div>
    </div>
    <div class="card">
      <div class="meta" id="meta"></div>
      <div class="muted">Tekst</div>
      <pre id="text">—</pre>
    </div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">Pełna odpowiedź (JSON)</div>
    <pre id="json">—</pre>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let currentFile = null;

function base() { return $("url").value.replace(/\/+$/, ""); }

async function checkReady() {
  try {
    const r = await fetch(base() + "/readyz");
    const body = await r.json();
    if (r.ok) {
      $("status").textContent = `● gotowy (${body.engine}, workerów: ${body.workers_ready}/${body.workers})`;
      $("status").className = "ok";
    } else {
      $("status").textContent = `● ${body.error?.message || "nie gotowy"}`;
      $("status").className = "err";
    }
  } catch {
    $("status").textContent = "● brak połączenia z serwisem";
    $("status").className = "err";
  }
}

function setFile(file) {
  if (!file) return;
  currentFile = file;
  $("fileinfo").textContent = `${file.name || "wklejony obraz"} · ${(file.size / 1024).toFixed(0)} KB`;
  $("img").src = URL.createObjectURL(file);
  $("boxes").innerHTML = "";
  $("send").disabled = false;
}

function drawBoxes(blocks) {
  const img = $("img"), svg = $("boxes");
  svg.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
  svg.setAttribute("preserveAspectRatio", "none");
  const stroke = Math.max(2, img.naturalWidth / 500);
  svg.innerHTML = (blocks || []).map(b => {
    const [x1, y1, x2, y2] = b.bbox;
    const title = `${b.text} (${(b.confidence * 100).toFixed(1)}%)`.replace(/</g, "&lt;");
    return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" fill="rgba(37,99,235,.12)" stroke="#2563eb" stroke-width="${stroke}"><title>${title}</title></rect>`;
  }).join("");
}

async function send() {
  if (!currentFile) return;
  $("send").disabled = true;
  $("send").textContent = "Przetwarzanie…";
  $("meta").innerHTML = ""; $("text").textContent = "…"; $("json").textContent = "…";
  const form = new FormData();
  form.append("file", currentFile, currentFile.name || "screenshot.png");
  const params = new URLSearchParams({ langs: $("langs").value, output: $("output").value });
  const headers = $("key").value ? { "X-API-Key": $("key").value } : {};
  const started = performance.now();
  try {
    const r = await fetch(`${base()}/v1/ocr?${params}`, { method: "POST", body: form, headers });
    const body = await r.json();
    const total = Math.round(performance.now() - started);
    $("json").textContent = JSON.stringify(body, null, 2);
    if (r.ok) {
      $("meta").innerHTML = `<span>HTTP <b class="ok">${r.status}</b></span><span>język: <b>${body.lang ?? "—"}</b></span>` +
        `<span>serwer: <b>${body.duration_ms} ms</b></span><span>łącznie: <b>${total} ms</b></span>` +
        `<span>bloków: <b>${body.blocks ? body.blocks.length : "—"}</b></span>`;
      $("text").textContent = body.text || "(brak tekstu)";
      drawBoxes(body.blocks);
    } else {
      $("meta").innerHTML = `<span>HTTP <b class="err">${r.status}</b></span><span class="err">${body.error?.code || ""}</span>`;
      $("text").textContent = body.error?.message || "Błąd";
    }
  } catch (e) {
    $("text").textContent = "Nie udało się połączyć z serwisem: " + e;
  } finally {
    $("send").disabled = false;
    $("send").textContent = "Wyślij do OCR";
    checkReady();
  }
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => setFile(e.target.files[0]);
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); setFile(e.dataTransfer.files[0]); };
document.addEventListener("paste", (e) => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith("image/"));
  if (item) setFile(item.getAsFile());
});
$("send").onclick = send;
$("url").onchange = checkReady;
checkReady();
setInterval(checkReady, 5000);
</script>
</body>
</html>
