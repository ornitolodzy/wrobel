[project]
name = "ocr-service"
version = "0.1.0"
description = "Lokalny mikroserwis OCR (PaddleOCR) do odczytu tekstu ze zrzutów ekranu"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "pillow>=11.0",
    "numpy>=1.26",
    # PaddleX depends on the contrib build; declaring the same one avoids two cv2 packages.
    "opencv-contrib-python>=4.10",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]

[project.scripts]
ocr-service = "ocr_service.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.uv]
# Supply-chain hygiene: ignore releases younger than ~2 weeks.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "ASYNC", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Polish text in strings/comments is intended
    "SIM905",  # word lists are written as "a b c".split() for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ocr_service"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paddleocr.*", "paddlex.*", "paddle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ocr: end-to-end tests with the real OCR engine (download models on first run)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:No ccache found:UserWarning"]
