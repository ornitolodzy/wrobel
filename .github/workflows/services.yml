name: Serwisy (gateway, scrapper, pipeline, graph, discord, frontend, stack)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      gateway: ${{ steps.f.outputs.gateway }}
      scrapper: ${{ steps.f.outputs.scrapper }}
      pipeline: ${{ steps.f.outputs.pipeline }}
      discord: ${{ steps.f.outputs.discord }}
      frontend: ${{ steps.f.outputs.frontend }}
      graph: ${{ steps.f.outputs.graph }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway: ["APIGateway/**", ".github/workflows/services.yml"]
            scrapper: ["PageScrapper/**", ".github/workflows/services.yml"]
            pipeline: ["VerificationPipeline/**", ".github/workflows/services.yml"]
            discord: ["DiscordBot/**", ".github/workflows/services.yml"]
            frontend: ["Frontend/**", ".github/workflows/services.yml"]
            graph: ["ContextGraph/**", ".github/workflows/services.yml"]
            infra: ["docker-compose.yml", "proxy/**", "start.sh", "*/Dockerfile", "DiscordBot/requirements.txt", ".github/workflows/services.yml"]

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: APIGateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: APIGateway/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  scrapper:
    needs: changes
    if: needs.changes.outputs.scrapper == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: PageScrapper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: PageScrapper/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: VerificationPipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: VerificationPipeline/pyproject.toml }
      - run: pip install -e ".[llm,retrieval,dev]"
      - run: python -m pytest -m "not live and not db"

  graph:
    needs: changes
    if: needs.changes.outputs.graph == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: ContextGraph } }
    services:
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: neo4j/contextgraph }
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p contextgraph 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_TEST_URI: bolt://127.0.0.1:7687
      NEO4J_PASSWORD: contextgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ContextGraph/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest

  discord:
    needs: changes
    if: needs.changes.outputs.discord == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: DiscordBot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: DiscordBot/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: Frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: Frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  stack:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Walidacja docker compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f VerificationPipeline/docker-compose.yml config --quiet
      - name: Build obrazów
        run: |
          docker compose build api-gateway page-scrapper verification-pipeline frontend
          docker compose --profile graph build context-graph
          docker compose --profile discord build discord-bot
