# APP (bez ruchu z internetu; porty 8001-8003 otwarte tylko dla EDGE w security group):
# verification pipeline, URL fetcher / ingestion, OCR, ContextGraph.
# Serwer GPU (Bielik, bge-m3, reranker) przez tunel SSH na docker0 = host.docker.internal, jak lokalnie.
name: wrobel

services:
  ocr:
    image: ${REGISTRY}/wrobel/ocr:${IMAGE_TAG}
    ports:
      - "8001:8000"
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: 8000
      OCR_LANGS: pl,en
      OCR_CALLBACK_URL: ""
      OCR_OFFLINE: "true"
      OCR_PADDLE_ENABLE_MKLDNN: "false"
      OCR_MODEL_DIR: /opt/models
      OCR_LOG_JSON: "true"
    restart: unless-stopped

  page-scrapper:
    image: ${REGISTRY}/wrobel/page-scrapper:${IMAGE_TAG}
    ports:
      - "8002:8002"
    environment:
      LOG_LEVEL: INFO
      DOCS_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://prawdowid:${PG_PASSWORD}@${DATA_HOST}:5432/prawdowid
      SOURCES_FILE: sources.yaml
      REQUEST_TIMEOUT_SECONDS: "15"
      RENDER_ENABLED: "true"
      SCRAPE_INTERVAL_MINUTES: "360"
      SCRAPE_ON_STARTUP: "false"
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      EUVSDISINFO_TOKEN: ${EUVSDISINFO_TOKEN:-}
      RAG_INGEST_URLS: ${RAG_INGEST_URLS:-http://verification-pipeline:8000/ingest,http://context-graph:8100/ingest/document}
    volumes:
      - ./PageScrapper/imports:/app/imports:ro
    shm_size: "512mb"
    depends_on:
      verification-pipeline:
        condition: service_healthy
    restart: unless-stopped

  verification-pipeline:
    image: ${REGISTRY}/wrobel/verification-pipeline:${IMAGE_TAG}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/home/pipeline/.cache/huggingface
    ports:
      - "8003:8000"
    environment:
      LOG_LEVEL: INFO
      PRAWDOWID_ENV: docker
      DATABASE_URL: postgresql://prawdowid:${PG_PASSWORD}@${DATA_HOST}:5432/prawdowid
      PRAWDOWID_SYNC_ON_STARTUP: "true"
      PRAWDOWID_LLM_PROVIDER: ${PRAWDOWID_LLM_PROVIDER:-}
      PRAWDOWID_LLM_MODEL: ${PRAWDOWID_LLM_MODEL:-}
      PRAWDOWID_LLM_API_BASE: ${PRAWDOWID_LLM_API_BASE:-}
      PRAWDOWID_LLM_JSON_MODE: ${PRAWDOWID_LLM_JSON_MODE:-}
      PRAWDOWID_LLM_TEMPERATURE: ${PRAWDOWID_LLM_TEMPERATURE:-}
      PRAWDOWID_RETRIEVAL_TOP_K: ${PRAWDOWID_RETRIEVAL_TOP_K:-}
      PRAWDOWID_MAX_CONTEXT_CHARS: ${PRAWDOWID_MAX_CONTEXT_CHARS:-}
      PRAWDOWID_RETRIEVAL_BACKEND: ${PRAWDOWID_RETRIEVAL_BACKEND:-}
      NEO4J_URI: bolt://${DATA_HOST}:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRAWDOWID_EMBEDDINGS_PROVIDER: ${PRAWDOWID_EMBEDDINGS_PROVIDER:-}
      PRAWDOWID_EMBEDDINGS_MODEL: ${PRAWDOWID_EMBEDDINGS_MODEL:-}
      PRAWDOWID_EMBEDDINGS_API_BASE: ${PRAWDOWID_EMBEDDINGS_API_BASE:-}
      PRAWDOWID_RERANKER_ENABLED: ${PRAWDOWID_RERANKER_ENABLED:-}
      PRAWDOWID_RERANKER_PROVIDER: ${PRAWDOWID_RERANKER_PROVIDER:-}
      PRAWDOWID_RERANKER_API_BASE: ${PRAWDOWID_RERANKER_API_BASE:-}
      PRAWDOWID_RERANKER_FALLBACK: ${PRAWDOWID_RERANKER_FALLBACK:-}
    restart: unless-stopped

  context-graph:
    image: ${REGISTRY}/wrobel/context-graph:${IMAGE_TAG}
    environment:
      NEO4J_URI: bolt://${DATA_HOST}:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
      EMBEDDINGS_API_BASE: ${EMBEDDINGS_API_BASE:-http://host.docker.internal:11435}
      EVENTS_PROVIDER: ${EVENTS_PROVIDER:-none}
      EVENTS_MODEL: ${EVENTS_MODEL:-SpeakLeash/bielik-11b-v2.3-instruct:Q4_K_M}
      EVENTS_API_BASE: ${EVENTS_API_BASE:-http://host.docker.internal:11435/v1}
      EVENTS_API_KEY: ${EVENTS_API_KEY:-}
      SCRAPER_URL: http://page-scrapper:8002
      RECONCILE_INTERVAL_MINUTES: ${GRAPH_RECONCILE_INTERVAL_MINUTES:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hf-cache:
