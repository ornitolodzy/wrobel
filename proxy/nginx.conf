events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Docker DNS, re-resolved every 10 s: after `docker compose up` recreates the gateway or the
  # frontend (new container IP) the proxy keeps working without a restart. Upstreams are kept in
  # variables, which is what makes nginx resolve them at request time instead of once at start.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    set $gateway http://api-gateway:8000;
    set $frontend http://frontend:4000;

    location /api/ {
      proxy_pass $gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      client_max_body_size 11m;
    }

    location = /health {
      proxy_pass $gateway;
    }

    location = /health/services {
      proxy_pass $gateway;
    }

    location /ws {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
