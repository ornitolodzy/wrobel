# Standalone VerificationPipeline (pipeline + its own Postgres on localhost:5432), for local
# development and the `db` tests of that repo. Run from this directory:
#   docker compose up -d db
# The full product stack is ../docker-compose.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prawdowid
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prawdowid}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../../VerificationPipeline/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build:
      context: ../../../VerificationPipeline
      dockerfile: ../Infra/docker/verification-pipeline/Dockerfile
    env_file:
      - path: ../../../VerificationPipeline/.env
        required: false
    depends_on: [db]
    ports: ["8000:8000"]

volumes:
  pgdata:
