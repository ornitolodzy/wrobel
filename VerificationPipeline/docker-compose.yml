# Samodzielny VerificationPipeline (pipeline + własny Postgres na localhost:5432) do developmentu
# i testów `db` tego serwisu. Uruchamiaj z katalogu VerificationPipeline/:
#   docker compose up -d db
# Cały stack produktu: ../docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prawdowid
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prawdowid}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on: [db]
    ports: ["8000:8000"]

volumes:
  pgdata:
