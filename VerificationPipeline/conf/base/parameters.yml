# Everything that can be swapped without touching code.

llm:
  # provider: mock | litellm | nli (nli: stance only). mock = rule-based, no network.
  # model: any LiteLLM model string, e.g. anthropic/claude-opus-5-5, mistral/mistral-large-latest,
  #        ollama/bielik, openai/<name> + api_base (vLLM). Real providers: conf/local/parameters.yml.
  roles:
    claims:  {provider: mock, model: anthropic/claude-opus-5-5, max_tokens: 2000, timeout_s: 20}
    stance:  {provider: mock, model: anthropic/claude-opus-5-5, max_tokens: 4000, timeout_s: 25}
    compose: {provider: mock, model: anthropic/claude-opus-5-5, max_tokens: 800, timeout_s: 15}
  max_claims: 3
  prices_per_mtok:          # [input, output] USD; used when LiteLLM has no price for the model
    anthropic/claude-opus-5-5: [4.00, 20.00]
    anthropic/claude-sonnet-5-5: [2.00, 10.00]
    anthropic/claude-haiku-5-5: [0.10, 0.50]

retrieval:
  backend: mock             # mock | postgres
  embedding_model: BAAI/bge-m3
  reranker_model: BAAI/bge-reranker-v2-m3
  candidates_per_query: 30
  top_k: 8
  max_per_document: 2
  max_per_dup_group: 2
  rrf_k: 60
  rerank_min: 0.30          # early stop -> brak_dowodow (calibrate on eval set)

web_search:
  # Links to check per factual claim. NOT evidence: does not change the verdict.
  # provider: mock (no network) | ddgs (DuckDuckGo, no key) | searxng (self-host) | brave (BRAVE_API_KEY)
  provider: mock
  enabled: true
  max_results: 8
  timeout_s: 8
  region: pl-pl             # ddgs
  backend: auto             # ddgs: auto | bing | duckduckgo | brave | google | mojeek | yahoo
  language: pl              # searxng, brave
  catalog_path: conf/base/sources.yml   # catalog domains ranked first and labelled
  # Extra query restricted to these domains, e.g. [gov.pl]. Works with brave/searxng;
  # ddgs returned no results for site: queries in tests, so it is off by default.
  site_queries: []
  blocked_domains: []

web_fetch:
  # Top search results -> page text -> evidence (stance + citation validator + policy).
  enabled: true
  top_n_pages: 3            # per claim
  timeout_s: 6
  max_bytes: 2000000
  respect_robots: true
  chunk_chars: 1200
  chunks_per_page: 2

citations:
  fuzzy_min: 90             # rapidfuzz partial_ratio

policy:
  source_weights:
    primary: 1.0
    factcheck: 0.9
    secondary: 0.6
    web: 0.3                # page outside the catalog: shown as a source, never decisive alone
  strong_source: 0.9
  min_weight_to_count: 0.6
  archive_after_days: 365

ingestion:
  sources_path: conf/base/sources.yml
  chunk_chars: 1200
  chunk_overlap: 150

eval:
  cases_path: tests/eval/cases.jsonl
  report_path: data/eval/report.json
