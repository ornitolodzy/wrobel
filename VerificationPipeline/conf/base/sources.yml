# Source catalog: the audited list of sources the system trusts (task requires >= 100 docs,
# >= 10 domains, >= 2 source types).
#
# type:   primary (official / state body) | factcheck | secondary (media, analyses)
# domain: matches the domain and its subdomains (gov.pl also matches www.gov.pl)
# path:   optional URL path prefix; the most specific entry wins (gov.pl/web/rcb -> RCB, not gov.pl)
# seeds:  start pages for the ingestion pipeline (basic links: Linki.md)
#
# Pages from domains NOT listed here can still be found by web search, but get type "web"
# (unvetted) and can never decide a verdict alone.

sources:
  # --- gov.pl portal: one entry per institution ---
  - domain: gov.pl
    publisher: "gov.pl (portal administracji)"
    type: primary
    license: informacja publiczna
    update: daily
  - domain: gov.pl
    path: /web/gov/ostrzezenia
    publisher: "Ostrzeżenia gov.pl"
    type: primary
    update: hourly
    seeds:
      - https://www.gov.pl/web/gov/ostrzezenia
      - https://www.gov.pl/web/gov/ostrzezenia#/_/mazowieckie/wszystkie
  - domain: gov.pl
    path: /web/rcb
    publisher: "Rządowe Centrum Bezpieczeństwa"
    type: primary
    update: daily
    seeds:
      - https://www.gov.pl/web/rcb/raport-dobowy3
      - https://www.gov.pl/web/rcb/strona-glowna-rzadowego-centrum-bezpieczenstwa
  - domain: gov.pl
    path: /web/mswia
