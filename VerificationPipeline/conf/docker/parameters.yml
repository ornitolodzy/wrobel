# Environment used inside the root docker-compose stack (PRAWDOWID_ENV=docker).
# Overrides only the keys listed here; everything else comes from conf/base.
# LLM model per deployment: PRAWDOWID_LLM_PROVIDER / PRAWDOWID_LLM_MODEL (see runtime._env_overrides)
# or per request from the API Gateway (PATCH /api/v1/config).

retrieval:
  # Shared Postgres of the stack: corpus fed by PageScrapper (RAG_INGEST_URL -> /ingest).
  backend: postgres

embeddings:
  # mock = deterministic word-hash vectors, no network. Switch to ollama + bge-m3 when a server
  # is available; the corpus is re-embedded automatically on the next sync (model change).
  provider: mock

ingestion:
  chunk_chars: 1200
  chunk_overlap: 150

reranker:
  # Cost is linear in candidates: on the GPU server (provider: remote) 30 candidates take ~0.1 s;
  # on CPU (provider: local) ~1 s each, so lower this to 10 when running without the GPU server.
  top_n: 30

eval:
  # Cases built from the PageScrapper corpus (the base ones cite Linki.md sources not in this corpus).
  # tests/ is not in the image: mount it, e.g. -v ./VerificationPipeline/tests/eval:/app/tests/eval:ro
  cases_path: tests/eval/cases_pagescrapper.jsonl
  retrieval_cases_path: tests/eval/retrieval_cases_realistic.jsonl   # end-to-end: Bielik extracts claims from `input`
  # retrieval_cases_path: tests/eval/retrieval_cases_pagescrapper.jsonl  # claims written by hand (easier)
