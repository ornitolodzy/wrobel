[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prawdowid"
version = "0.1.0"
description = "Prawdowid: verification pipeline (claims -> evidence -> stance -> verdict) for MSZ HackNation 2026"
requires-python = ">=3.11"
dependencies = [
    "kedro>=1.0,<2",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rapidfuzz>=3.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["litellm>=1.110"]
retrieval = [
    "neo4j>=5.20",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
]
# Reranker on CPU. Install torch from the CPU index first to avoid ~2.5 GB of CUDA:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
rerank = ["torch>=2.3", "transformers>=4.44"]
nli = ["transformers>=4.44", "torch>=2.3"]
ingestion = ["httpx>=0.27", "trafilatura>=2"]
dev = ["pytest>=8", "kedro-viz>=10", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prawdowid = ["prompts/*.md"]

[tool.kedro]
package_name = "prawdowid"
project_name = "prawdowid"
kedro_init_version = "1.0.0"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: real model call, costs tokens (needs PRAWDOWID_LIVE_MODEL)",
    "db: needs Postgres from docker-compose (skipped when unreachable)",
]

[tool.ruff]
line-length = 100

[tool.kedro_telemetry]
project_id = "888b74380a824123ab509cb56621e817"
