# Standalone stack of this repo (pipeline + its own Postgres), for local development.
# Run from the repo root:  docker compose -f infra/docker/docker-compose.yml up -d db
# The full product stack (gateway, scrapper, OCR, frontend) lives in the parent hacknation repo.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prawdowid
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prawdowid}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    depends_on: [db]
    ports: ["8000:8000"]

volumes:
  pgdata:
